<!-- pessoa.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Pessoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilo adicional para garantir que os botões fiquem bem distribuídos e centralizados */
        .button-container {
            display: flex;
            justify-content: center;  /* Centraliza os botões horizontalmente */
            gap: 20px;  /* Espaçamento entre os botões */
            margin-top: 100px;  /* Espaçamento superior */
        }

        .button-container .btn {
            width: 200px;  /* Largura dos botões */
            padding: 15px;  /* Aumento no tamanho do botão */
            font-size: 1.2rem;  /* Aumentar o tamanho da fonte */
        }
    </style>
</head>
<body class="bg-light">

    <div class="container">
        <div class="text-center">
            <h1 class="mt-5">Escolha uma Opção</h1>
            <div class="button-container">
                <!-- Botões -->
                <a href="{% url 'clientes' %}" class="btn btn-primary">Ir para Clientes</a>
                <a href="{% url 'funcionarios' %}" class="btn btn-secondary">Ir para Funcionários</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
